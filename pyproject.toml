[project]
name = "ai-agent-launch-platform"
version = "0.1.0"
description = "A platform that takes AI agents from a department's process to production: readiness check, exam on real cases, deployment, value measured against the baseline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "httpx>=0.27",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "croniter>=2.0",
    "jinja2>=3.1",
]

[project.scripts]
agents = "agent_platform.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
